<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #host { width: 100%; }
  #host iframe { display: block; width: 100%; border: 0; }
</style>
</head>
<body>
<div id="host"></div>
<script>
(function () {
  "use strict";

  // 与 Streamlit 组件宿主的最小协议握手：componentReady → render/componentValue。
  // 发往宿主的消息必须带 isStreamlitMessage 标记，否则会被宿主静默丢弃。
  function send(message) {
    message.isStreamlitMessage = true;
    window.parent.postMessage(message, "*");
  }

  var MIN_HEIGHT = 240;
  var MAX_HEIGHT = 60000;
  var FALLBACK_HEIGHT = 800;
  var currentHeight = 0;
  var lastHtml = null;
  var lastStatesText = "{}";
  var pendingStates = null; // 报告 iframe 就绪后要下发的标记状态

  // 宿主可能在一秒内重发多次 render；高度上报也会再触发一轮组件渲染。
  // 两个方向都做去重/节流，避免"重建报告 iframe → 上报高度 → 再渲染"的
  // 自激循环把报告翻个不停。
  function frameHeight(height) {
    var value = Math.round(Number(height)) || 0;
    if (value < MIN_HEIGHT) value = MIN_HEIGHT;
    if (value > MAX_HEIGHT) value = MAX_HEIGHT;
    if (value === currentHeight) return;
    currentHeight = value;
    send({ type: "streamlit:setFrameHeight", height: value });
  }

  function statesText(states) {
    try { return JSON.stringify(states || {}); } catch (e) { return "{}"; }
  }

  function pushStates(frame, states) {
    if (!frame || !frame.contentWindow) return;
    frame.contentWindow.postMessage(
      { type: "arxiv-report-states", states: states || {} }, "*"
    );
  }

  function renderReport(args) {
    var html = String(args && args.html ? args.html : "");
    var states = (args && args.states && typeof args.states === "object")
      ? args.states : {};
    var host = document.getElementById("host");
    var statesChanged = statesText(states) !== lastStatesText;
    lastStatesText = statesText(states);

    if (html !== lastHtml) {
      lastHtml = html;
      host.innerHTML = "";
      var frame = document.createElement("iframe");
      frame.title = "Daily report preview";
      // 报告 HTML 保持与旧版预览一致的沙箱：可执行脚本（KaTeX），但与面板源隔离。
      frame.setAttribute("sandbox", "allow-scripts allow-popups");
      frame.setAttribute("referrerpolicy", "no-referrer");
      frame.style.height = (currentHeight || FALLBACK_HEIGHT) + "px";
      // 通过属性赋值设置 srcdoc，由 DOM 负责编码，报告内容无法逃出 iframe。
      frame.srcdoc = html;
      // srcdoc 内联脚本先于 load 执行：load 后下发状态不会丢。
      frame.addEventListener("load", function () { pushStates(frame, pendingStates); });
      host.appendChild(frame);
      pendingStates = states;
      if (!currentHeight) {
        frameHeight(FALLBACK_HEIGHT);
      }
      return;
    }

    if (host.children.length === 0) return;
    // 内容没变则保留现有沙箱 iframe（保住滚动位置与 KaTeX 渲染）。
    // 仅状态变化时向现有 iframe 下发状态，报告不重载、不闪烁。
    if (statesChanged) {
      pendingStates = states;
      pushStates(host.children[0], states);
    }
  }

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || typeof data !== "object") return;
    switch (data.type) {
      case "streamlit:render":
        renderReport(data.args);
        break;
      case "arxiv-report-mark":
        // 沙箱报告里的标记点击，转发给 Python 侧（组件返回值）。
        // nonce 用于 Python 端防重：组件值会跨 rerun 保留，同一次点击只落库一次。
        send({
          type: "streamlit:setComponentValue",
          dataType: "json",
          value: {
            source: String(data.source || ""),
            paper_id: String(data.paper_id || ""),
            pref: String(data.pref || "none"),
            nonce: String(data.nonce || ""),
          },
        });
        break;
      case "arxiv-report-height":
        frameHeight(data.height);
        break;
      default:
        break;
    }
  });

  send({ type: "streamlit:componentReady", apiVersion: 1 });
})();
</script>
</body>
</html>
