services:
  arxiv-daily-researcher:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    # 默认使用本地构建镜像；部署者可通过 ADR_WORKER_IMAGE 覆盖为固定的
    # GHCR 版本标签。保留 build 以支持源码部署和本地开发。
    image: ${ADR_WORKER_IMAGE:-arxiv-daily-researcher:latest}
    container_name: arxiv-daily-researcher
    restart: unless-stopped

    stdin_open: true
    tty: true

    # 使用宿主机网络，使容器可直接访问 localhost 上的本地 LLM API 等服务
    network_mode: host

    env_file:
      - .env

    environment:
      - TZ=Asia/Shanghai
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - RUN_ON_STARTUP=false
      - MODE=cron
      - SETUP_WIZARD=auto

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
      - ./.env:/app/.env

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    healthcheck:
      test: [ "CMD", "python", "/app/src/utils/container_health.py", "worker" ]
      interval: 1m
      timeout: 20s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== Config Panel (Web UI) ====================
  config-panel:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: webui
    # 与 worker 保持相同的版本来源，避免 WebUI 与后端协议错配。
    image: ${ADR_WEBUI_IMAGE:-arxiv-daily-researcher-config-panel:latest}
    container_name: arxiv-daily-researcher-config-panel
    restart: unless-stopped

    # Match the worker's localhost semantics so WebUI connection tests can
    # reach host-side proxies and local LLM services exactly as scheduled jobs
    # do.  Streamlit itself stays bound to loopback unless an authenticated
    # reverse proxy is deliberately configured by the operator.
    network_mode: host
    command:
      - streamlit
      - run
      - src/webui/config_panel.py
      - --server.address=127.0.0.1
      - --server.port=8503

    environment:
      - TZ=Asia/Shanghai
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}

    volumes:
      - ./configs:/app/configs
      - ./.env:/app/.env
      - ./.env.example:/app/.env.example:ro
      - ./data:/app/data
      - ./logs:/app/logs

    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 128M

    healthcheck:
      test: [ "CMD", "python", "/app/src/utils/container_health.py", "webui", "--url", "http://127.0.0.1:8503/_stcore/health" ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
